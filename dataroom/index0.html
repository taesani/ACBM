<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>6x6 Grid Link Box</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f8fafc;
            font-family: system-ui, -apple-system, sans-serif;
        }

        /* 6행 6열 그리드 컨테이너 */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(6, 2cm);
            grid-template-rows: repeat(6, 1cm);
            gap: 40px; /* 박스 사이의 간격 (원치 않으시면 0으로 변경 가능) */
            padding: 10px;
            background-color: #ffffff;
            border-radius: 8px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        /* 개별 박스(링크) 스타일 */
        .grid-box {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 1cm;
            height: 1cm;
            background-color: #3b82f6;
            color: #ffffff;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
            border-radius: 4px;
            transition: background-color 0.2s, transform 0.1s;
            box-sizing: border-box;
        }

        /* 마우스 오버 시 효과 */
        .grid-box:hover {
            background-color: #1d4ed8;
            transform: scale(1.05);
        }
    </style>
</head>
<body>

<div class="grid-container">
    <!-- Row 1 -->
    <a href="index1.html" class="grid-box">1</a>
    <a href="index2.html" class="grid-box">2</a>
    <a href="index3.html" class="grid-box">3</a>
    <a href="index4.html" class="grid-box">4</a>
    <a href="index5.html" class="grid-box">5</a>
    <a href="index6.html" class="grid-box">6</a>

    <!-- Row 2 -->

    <a href="index11.html" class="grid-box">11</a>

</html>
