<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>6x6 Rectangular Grid Link Box</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f8fafc;
            font-family: system-ui, -apple-system, sans-serif;
        }

        /* 6행 6열 그리드 컨테이너 */
        .grid-container {
            display: grid;
            /* 가로 2cm 박스 6개 */
            grid-template-columns: repeat(6, 2cm);
            /* 세로 1cm 박스 6개 */
            grid-template-rows: repeat(6, 1cm);
            /* 박스와 박스 사이의 간격 1cm */
            gap: 1cm; 
            padding: 20px;
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05);
        }

        /* 개별 직사각형 박스 스타일 (가로 2cm * 세로 1cm) */
        .grid-box {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 2cm;
            height: 1cm;
            background-color: #0f172a; /* 신뢰감을 주는 어두운 네이비 톤 */
            color: #ffffff;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            border-radius: 4px;
            transition: background-color 0.2s, transform 0.1s;
            box-sizing: border-box;
        }

        /* 마우스 오버 시 효과 */
        .grid-box:hover {
            background-color: #2563eb;
            transform: scale(1.05);
        }
    </style>
</head>
<body>

<div class="grid-container">
    <!-- Row 1 -->
    <a href="DATA_1.html" class="grid-box">1</a>
    <a href="DATA_2.html" class="grid-box">2</a>
    <a href="DATA_3.html" class="grid-box">3</a>
    <a href="DATA_4.html" class="grid-box">4</a>
